<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漂着 - ep2:"寒空の少女"</title>
  <style>
    @font-face {
      font-family: "OCR A Site";
      src: local("OCR A Extended");
      unicode-range: U+0000-007F;
    }

    :root {
      --ink: #4d5b5f;
      --ink-deep: rgba(42, 57, 62, 0.82);
      --ink-soft: rgba(77, 91, 95, 0.14);
      --paper: rgba(255, 255, 255, 0.72);
      --line: rgba(91, 108, 113, 0.78);
      --accent: #6fc3f2;
      --font-main: "OCR A Site", "メイリオ", Meiryo, sans-serif;
      --font-ja: "メイリオ", Meiryo, sans-serif;
      --art-height: calc(100vw * 1.25878);
      --layout-left: clamp(44px, 8vw, 120px);
      --title-safe-right: 74vw;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #fff;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: max(100vh, var(--art-height));
      margin: 0;
      color: var(--ink);
      font-family: var(--font-ja);
      background-color: #fff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(90deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.78) 58%, rgba(255, 255, 255, 0.2)),
        url("../418alt3.png");
      background-position: center top, center top;
      background-size: 100vw auto, 100vw auto;
      background-repeat: no-repeat, no-repeat;
      background-attachment: fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      width: calc(100vw - var(--layout-left) - clamp(18px, 2.8vw, 36px));
      min-height: max(100vh, var(--art-height));
      margin-left: var(--layout-left);
      padding: clamp(52px, 8vw, 92px) clamp(18px, 2.8vw, 36px) 64px;
      margin-right: 0;
    }

    .section {
      margin-bottom: clamp(28px, 5vw, 48px);
    }

    .ribbon {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      margin-left: 0;
      padding: 8px 58px 9px clamp(18px, 3vw, 34px);
      color: #fff;
      background: var(--ink-deep);
      font-family: var(--font-main);
      font-size: clamp(1.45rem, 4vw, 2.6rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      text-decoration: none;
      text-transform: lowercase;
      white-space: nowrap;
      filter: drop-shadow(0 5px 9px rgba(33, 45, 48, 0.16));
    }

    .ribbon.small {
      min-height: 36px;
      padding-top: 7px;
      padding-bottom: 7px;
      padding-right: 44px;
      font-size: clamp(1rem, 2.7vw, 1.55rem);
    }

    /* Episode Page Styles */

    .intro-header {
      margin-bottom: clamp(32px, 6vw, 52px);
      padding-bottom: clamp(18px, 3vw, 28px);
      border-bottom: 3px solid var(--line);
      width: 100%;
    }

    .intro-content {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 6px;
      padding: clamp(24px, 4vw, 44px);
      min-height: clamp(300px, 60vh, 600px);
      margin-bottom: clamp(32px, 6vw, 52px);
      line-height: 1.8;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: rgba(62, 76, 80, 0.95);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* Navigation Buttons */
    .nav-buttons {
      display: flex;
      gap: clamp(16px, 3vw, 24px);
      margin-bottom: clamp(20px, 3vw, 32px);
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      font-family: var(--font-main);
      font-size: clamp(0.9rem, 2vw, 1rem);
      text-decoration: none;
      transition: background-color 150ms ease, transform 150ms ease;
      cursor: pointer;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      background: var(--paper);
      outline: none;
    }

    .nav-button.prev:hover {
      transform: translateX(-5px);
    }

    .nav-button.next:hover {
      transform: translateX(5px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(28px, 5vw, 48px);
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      font-family: var(--font-main);
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      text-decoration: none;
      transition: background-color 150ms ease, transform 150ms ease;
      cursor: pointer;
    }

    .back-link:hover,
    .back-link:focus-visible {
      background: var(--paper);
      transform: translateX(-5px);
      outline: none;
    }

    @media (max-width: 660px) {
      .page {
        width: 100%;
        margin-left: 0;
        padding-top: 42px;
      }

      .nav-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="section intro-header" aria-labelledby="intro-title">
      <h1 id="intro-title" class="ribbon small">ep2:"寒空の少女"</h1>
    </section>

    <section class="section" aria-labelledby="intro-title">
      <div id="content" class="intro-content">
このページにエピソードの本文を入れてください。
改行は自動で保持されます。
ストーリーの内容をここに記述できます。
      </div>
    </section>

    <div class="nav-buttons">
      <a href="episode-01-5.html" class="nav-button prev">← ep1.5へ戻る</a>
      <a href="episode-03.html" class="nav-button next">ep3へ進む →</a>
    </div>

    <a href="../index.html" class="back-link">← 戻る</a>
  </main>
</body>
</html>
